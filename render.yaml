# Render Blueprint: one web service; FastAPI serves the API and static/.
# Render -> New -> Blueprint -> pick this repo. Details in README.
services:
  - type: web
    name: suaru
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Public liveness probe (no cookie); also warms the free plan before a demo.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
