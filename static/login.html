<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Suaru</title>
  <style>
    :root {
      --green: #1f7a3f;
      --green-dark: #145c2d;
      --ink: #1c2b21;
      --muted: #61756a;
      --line: #e3ebe5;
      --red: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: #dfe9e2;
    }
    .card {
      width: 100%;
      max-width: 340px;
      padding: 22px 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }
    .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .brand h1 { margin: 0; font-size: 1.5rem; color: var(--green); letter-spacing: -0.5px; }
    .brand span {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--green);
      background: #e7f4ec;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .tagline { margin: 0 0 16px; font-size: 0.85rem; color: var(--muted); }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }
    input {
      width: 100%;
      margin-top: 4px;
      padding: 10px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(31, 122, 63, 0.12);
    }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--green);
      cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin: 10px 0 0; font-size: 0.85rem; color: var(--red); }
    .switch { margin: 14px 0 0; font-size: 0.85rem; color: var(--muted); text-align: center; }
    .switch a { color: var(--green); font-weight: 600; cursor: pointer; }
    .hint { margin: 14px 0 0; font-size: 0.75rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><h1>Suaru</h1><span>вход</span></div>
    <p class="tagline">Вода, дизель и CO₂ для вашего поля. Войдите, чтобы продолжить.</p>

    <form id="auth-form">
      <label>Логин
        <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32">
      </label>
      <label>Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
      </label>
      <button id="submit" type="submit">Войти</button>
      <p class="error" id="error" hidden></p>
    </form>

    <p class="switch">
      <span id="switch-text">Ещё нет аккаунта?</span>
      <a id="switch-link">Зарегистрироваться</a>
    </p>
    <p class="hint">После регистрации сразу попадёте на карту.</p>
  </main>

  <script>
    const form = document.getElementById('auth-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit');
    const switchText = document.getElementById('switch-text');
    const switchLink = document.getElementById('switch-link');
    const passwordInput = document.getElementById('password');
    let mode = 'login';

    function setMode(next) {
      mode = next;
      submitBtn.textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
      switchText.textContent = mode === 'login' ? 'Ещё нет аккаунта?' : 'Уже есть аккаунт?';
      switchLink.textContent = mode === 'login' ? 'Зарегистрироваться' : 'Войти';
      passwordInput.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      errorEl.hidden = true;
    }
    switchLink.addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;
      try {
        const resp = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: passwordInput.value,
          }),
        });
        if (resp.ok) {
          location.href = '/';
          return;
        }
        let detail = 'Не получилось войти, попробуйте ещё раз';
        try { detail = (await resp.json()).detail || detail; } catch (_) {}
        errorEl.textContent = detail;
        errorEl.hidden = false;
      } catch (_) {
        errorEl.textContent = 'Сервер не отвечает: проверьте интернет и нажмите ещё раз';
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
